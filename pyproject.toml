[project]
name = "repo-substrate"
version = "0.2.2"
description = "Deterministic structural fingerprint of a git repository (codebase-as-structure C1) and its validation gate."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydriller>=2.7,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
]

[project.scripts]
substrate = "repo_substrate.cli:main"
substrate-validate = "repo_substrate.validation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_substrate"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
