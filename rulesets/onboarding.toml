# Every pNN below ranks the mapped repository's own population (in-repo, self-relative, D-019):
# a top decile exists in every repository, so a count of marks is a share, not a condition.
# Structural mapper ruleset — onboarding profile (system spec §5.4, D-017).
#
# The onboarding lens foregrounds where a newcomer enters and what everything routes
# through: entrances, corridors, foundations, strata. It is an OVERLAY: applied with the
# maintainability base, it changes which rooms are marked and nothing about where they are
# (mapper §6 — layering, never unification). Every feature rests on asserted signals and
# denotes present structural position.

[ruleset]
name = "onboarding"
version = "0.2.0"
profile = "onboarding"
description = "Where to start reading: package entries (declared in package.json), import-graph roots (import much, imported by nothing), corridors (high centrality and high fan-out — everything routes through), foundations. Position names throughout."

[[feature]]
name = "package_entry"
predicate = "is_package_entry == 1"
position_name = "declared package entry"
note = "The file a package.json names as main, module, types, bin, or an export — the door a consumer is told to use. is_package_entry is a G1 flag with a declared heuristic (built entry → source); it is never ranked (D-029)."

[[feature]]
name = "import_root"
predicate = "fan_in == 0 and fan_out >= p75"
graph_dependent = true
position_name = "import-graph root"
note = "Imported by no in-repo file and importing more than most. In an application this is where execution enters; in a library it is often a tool or a script, because the library's own entry is imported internally (D-028 hostile-reader #3) — hence the rename from entrance (D-029). fan_in and fan_out are G2 instrument-checked."

[[feature]]
name = "corridor"
predicate = "centrality >= p90 and fan_out >= p50"
graph_dependent = true
position_name = "high-centrality, high-fan-out junction"
note = "High PageRank AND imports many: traffic passes through rather than terminating here. Distinct from foundation (high load, typically low fan-out)."

[[feature]]
name = "foundation"
predicate = "load_index >= p90"
graph_dependent = true
name_implies_consequence = true
position_name = "high-load hub"
note = "Shared with the maintainability profile so a co-located finding is visible: the same room marked by two lenses is shown twice, never averaged."

[[feature]]
name = "leaf_utility"
predicate = "fan_out == 0 and fan_in >= p75"
graph_dependent = true
position_name = "imported leaf"
note = "Imports nothing in-repo and is imported by many: read these first; they have no prerequisites."
