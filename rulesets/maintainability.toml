# Every pNN below ranks the mapped repository's own population (in-repo, self-relative, D-019):
# a top decile exists in every repository, so a count of marks is a share, not a condition.
# Structural mapper ruleset — maintainability profile (structural-mapper-spec §4, D-016).
#
# Every feature reads signals from substrate.json and is admitted only if validation.json
# marks each of them `validated` or `asserted`, or the feature is `decorative = true` with a
# decorative_reason. Thresholds `pNN` are percentiles of that signal across the population.
#
# Register discipline (validation §2.1.1, D-004 Q3): every feature here rests on `asserted`
# signals and therefore denotes a present structural position. A feature whose name
# colloquially implies a consequence carries name_implies_consequence = true and a
# position_name; the renderer and any narrative must disclose that the name denotes
# position, not a forecast. No feature in this profile voices "will break" or "ripples".

[ruleset]
name = "maintainability"
version = "0.2.1"
profile = "maintainability"
description = "v0 maintainability lens: load, neglect, reinforcement, activity — over asserted signals only; the two pressure indices are unvalidated (D-015) and appear only as decorative features."
wing_depth = 1

[[feature]]
name = "foundation"
predicate = "load_index >= p90"
graph_dependent = true
name_implies_consequence = true
position_name = "high-load hub"
note = "Top decile of the load blend (fan_in_nonzero, centrality, inverse fan_out, size). A description of import-graph position; not a claim about what breaks if it changes."

[[feature]]
name = "hub"
predicate = "centrality >= p90"
graph_dependent = true
note = "Top-decile PageRank over the import graph. A pure position name needs no position_name (D-024)."

[[feature]]
name = "flooded_basement"
predicate = "last_touched_days >= p90 and load_index >= 0.10"
graph_dependent = true
name_implies_consequence = true
position_name = "long-untouched, still-imported room"
note = "Long untouched and still imported: the position name says exactly what the predicate reads. D-031 replaced neglect_index (a blend whose recent_commit_share input is a window over the last fifth of commits and cannot be stable at K = 25 by construction) with the stable primitive last_touched_days, which the position name already meant. load_index is a G4 blend of checked measurements. Present-tense: this is where the water is, not a prediction that it rises."

[[feature]]
name = "scaffolding"
predicate = "reinforcement_index >= 0.5"
name_implies_consequence = true  # D-035 (enacted D-038): scaffolding is a temporary structure; the name carries its position
position_name = "test-imported room at or above the median reinforcement"
graph_dependent = true
note = "At least one test file imports the node (import-graph reading of reinforcement, D-011)."

[[feature]]
name = "dark_room"
predicate = "last_touched_days >= p90"
name_implies_consequence = true
position_name = "long-untouched room"
note = "Top decile of time since last edit. Lighting, not judgment: a finished utility is dark too (stance disclosure, system spec)."

[[feature]]
name = "lit_room"
predicate = "last_touched_days <= p10"
note = "Bottom decile of time since last edit — occupied now."

[[feature]]
name = "toothpick_wing"
predicate = "load_index >= p90 and bug_pressure_index >= p90 and reinforcement_index <= 0.0"
graph_dependent = true
decorative = true
decorative_reason = "bug_pressure_index is unvalidated on the pre-registered test set (D-015): its tuned weights assign zero to fix history and it does not beat busyness by the margin. The fragility half of this feature has no forecast to stand on; it renders as decorative, counted, and excluded from diagnostic claims until a reference repo validates the index."
name_implies_consequence = true
position_name = "unreinforced high-load node with high edit pressure"
note = "The flagship June feature, kept on the page so its absence from the diagnosis is visible rather than silent."

[[feature]]
name = "crack"
predicate = "bug_pressure_index >= p90"
decorative = true
decorative_reason = "bug_pressure_index is unvalidated (D-015)."
name_implies_consequence = true
position_name = "high edit-pressure node"
